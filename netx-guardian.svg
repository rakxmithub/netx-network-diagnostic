<div align="center">

<svg width="900" height="420" viewBox="0 0 900 420"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Consolas, 'Courier New', monospace">

  <defs>

    <!-- GREEN GLOW -->
    <filter id="glow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">

      <feGaussianBlur
          stdDeviation="2.5"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- PANEL -->
    <linearGradient
        id="panel"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#101a16"/>

      <stop offset="50%"
            stop-color="#07110d"/>

      <stop offset="100%"
            stop-color="#020605"/>

    </linearGradient>

    <!-- SCANLINE -->
    <linearGradient
        id="scan"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#00FF88"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#00FF88"
            stop-opacity="0.8"/>

      <stop offset="100%"
            stop-color="#00FF88"
            stop-opacity="0"/>

    </linearGradient>

    <clipPath id="round">
      <rect
          width="900"
          height="420"
          rx="16"/>
    </clipPath>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <g clip-path="url(#round)">

    <rect
        width="900"
        height="420"
        fill="url(#panel)"/>


    <!-- GRID -->

    <g
        stroke="#00FF88"
        stroke-opacity="0.055"
        stroke-width="1">

      <path d="M0 70H900"/>
      <path d="M0 105H900"/>
      <path d="M0 140H900"/>
      <path d="M0 175H900"/>
      <path d="M0 210H900"/>
      <path d="M0 245H900"/>
      <path d="M0 280H900"/>
      <path d="M0 315H900"/>
      <path d="M0 350H900"/>

      <path d="M50 34V420"/>
      <path d="M100 34V420"/>
      <path d="M150 34V420"/>
      <path d="M200 34V420"/>
      <path d="M250 34V420"/>
      <path d="M300 34V420"/>
      <path d="M350 34V420"/>
      <path d="M400 34V420"/>
      <path d="M450 34V420"/>
      <path d="M500 34V420"/>
      <path d="M550 34V420"/>
      <path d="M600 34V420"/>
      <path d="M650 34V420"/>
      <path d="M700 34V420"/>
      <path d="M750 34V420"/>
      <path d="M800 34V420"/>
      <path d="M850 34V420"/>

    </g>


    <!-- ================================================= -->
    <!-- TERMINAL HEADER -->
    <!-- ================================================= -->

    <rect
        x="0"
        y="0"
        width="900"
        height="38"
        fill="#0d1512"/>

    <line
        x1="0"
        y1="38"
        x2="900"
        y2="38"
        stroke="#00FF88"
        stroke-opacity="0.3"/>


    <!-- TERMINAL BUTTONS -->

    <circle
        cx="22"
        cy="19"
        r="6"
        fill="#00FF88"
        opacity="0.35"/>

    <circle
        cx="42"
        cy="19"
        r="6"
        fill="#00FF88"
        opacity="0.55"/>

    <circle
        cx="62"
        cy="19"
        r="6"
        fill="#00FF88"
        opacity="0.8"/>


    <!-- TITLE -->

    <text
        x="450"
        y="24"
        text-anchor="middle"
        fill="#00FF88"
        font-size="13"
        font-weight="bold">

      NETX://NETWORK_GUARDIAN

    </text>


    <!-- ================================================= -->
    <!-- MOVING SCAN BAR -->
    <!-- ================================================= -->

    <rect
        x="-250"
        y="40"
        width="250"
        height="2"
        fill="url(#scan)"
        opacity="0.8">

      <animate
          attributeName="x"
          values="-250;900"
          dur="3s"
          repeatCount="indefinite"/>

    </rect>


    <!-- ================================================= -->
    <!-- NETWORK CONNECTION LINES -->
    <!-- ================================================= -->

    <g
        fill="none"
        stroke="#00FF88"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)">


      <!-- MAIN SPINE -->

      <path
          d="
          M105 320
          L175 292
          L245 265
          L315 242
          L390 230
          L465 215
          L520 190
          L565 165
          L610 145
          L660 132
          L725 145
          "
          stroke-width="3"/>


      <!-- LOWER CONNECTION -->

      <path
          d="
          M175 292
          L150 255
          "

          stroke-width="1.8"/>

      <path
          d="
          M245 265
          L225 225
          "

          stroke-width="1.8"/>

      <path
          d="
          M315 242
          L305 195
          "

          stroke-width="1.8"/>

      <path
          d="
          M465 215
          L455 170
          "

          stroke-width="1.8"/>

      <path
          d="
          M565 165
          L555 125
          "

          stroke-width="1.8"/>

      <path
          d="
          M660 132
          L645 90
          "

          stroke-width="1.8"/>


      <!-- NODE CONNECTIONS -->

      <path
          d="M105 320L65 340"
          stroke-width="2"/>

      <path
          d="M725 145L770 170"
          stroke-width="2"/>

    </g>


    <!-- ================================================= -->
    <!-- NODES -->
    <!-- ================================================= -->

    <g
        fill="#00FF88"
        filter="url(#glow)">

      <circle cx="105" cy="320" r="5"/>
      <circle cx="175" cy="292" r="5"/>
      <circle cx="245" cy="265" r="5"/>
      <circle cx="315" cy="242" r="5"/>
      <circle cx="390" cy="230" r="5"/>
      <circle cx="465" cy="215" r="5"/>
      <circle cx="520" cy="190" r="5"/>
      <circle cx="565" cy="165" r="5"/>
      <circle cx="610" cy="145" r="5"/>
      <circle cx="660" cy="132" r="5"/>
      <circle cx="725" cy="145" r="5"/>

    </g>


    <!-- ================================================= -->
    <!-- PULSING NODES -->
    <!-- ================================================= -->

    <g fill="none" stroke="#00FF88">

      <circle
          cx="390"
          cy="230"
          r="10"
          opacity="0.35">

        <animate
            attributeName="r"
            values="8;22;8"
            dur="2s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="0.6;0;0.6"
            dur="2s"
            repeatCount="indefinite"/>

      </circle>


      <circle
          cx="610"
          cy="145"
          r="10"
          opacity="0.35">

        <animate
            attributeName="r"
            values="8;20;8"
            dur="2.4s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="0.6;0;0.6"
            dur="2.4s"
            repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- DIGITAL WING -->
    <!-- ================================================= -->

    <g
        transform-origin="470px 210px"
        fill="#00FF88"
        fill-opacity="0.12"
        stroke="#00FF88"
        stroke-width="2"
        filter="url(#glow)">

      <path
          d="
          M470 210
          Q445 135 425 80
          Q465 98 495 60
          Q510 100 545 88
          Q520 140 500 195
          Q485 207 470 210
          Z"/>


      <path
          d="M470 210L440 120"/>

      <path
          d="M470 210L475 90"/>

      <path
          d="M470 210L520 105"/>


      <animateTransform
          attributeName="transform"
          type="rotate"
          values="
          0 470 210;
          -18 470 210;
          0 470 210;
          14 470 210;
          0 470 210"
          dur="2.2s"
          repeatCount="indefinite"/>

    </g>


    <!-- ================================================= -->
    <!-- SECOND WING -->
    <!-- ================================================= -->

    <g
        transform-origin="470px 210px"
        fill="#00FF88"
        fill-opacity="0.06"
        stroke="#00FF88"
        stroke-width="1.2"
        opacity="0.5">

      <path
          d="
          M470 210
          Q445 135 425 80
          Q465 98 495 60
          Q510 100 545 88
          Q520 140 500 195
          Q485 207 470 210
          Z"/>

      <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 470 210;-14 470 210;0 470 210"
          dur="2.2s"
          repeatCount="indefinite"
          begin="0.2s"/>

    </g>


    <!-- ================================================= -->
    <!-- HEAD -->
    <!-- ================================================= -->

    <g
        fill="none"
        stroke="#00FF88"
        stroke-width="3"
        filter="url(#glow)">

      <path
          d="
          M660 132
          L715 145
          L745 165
          L710 185
          L670 175
          Z"/>

    </g>


    <!-- ================================================= -->
    <!-- EYE -->
    <!-- ================================================= -->

    <circle
        cx="690"
        cy="145"
        r="6"
        fill="#ffffff"
        filter="url(#glow)">

      <animate
          attributeName="r"
          values="6;6;1;6;6"
          keyTimes="0;0.42;0.46;0.5;1"
          dur="4s"
          repeatCount="indefinite"/>

    </circle>


    <!-- ================================================= -->
    <!-- DATA PACKET -->
    <!-- ================================================= -->

    <circle
        r="5"
        fill="#ffffff"
        filter="url(#glow)">

      <animateMotion
          dur="3s"
          repeatCount="indefinite"
          path="
          M65 340
          L105 320
          L175 292
          L245 265
          L315 242
          L390 230
          L465 215
          L520 190
          L565 165
          L610 145
          L660 132
          L725 145
          "/>

    </circle>


    <!-- ================================================= -->
    <!-- OUTGOING DATA -->
    <!-- ================================================= -->

    <g
        fill="#00FF88"
        filter="url(#glow)">

      <rect
          x="745"
          y="155"
          width="9"
          height="9"
          rx="2">

        <animate
            attributeName="x"
            values="745;840"
            dur="1.3s"
            repeatCount="indefinite"/>

        <animate
            attributeName="y"
            values="155;125"
            dur="1.3s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="1;0"
            dur="1.3s"
            repeatCount="indefinite"/>

      </rect>


      <rect
          x="745"
          y="165"
          width="7"
          height="7"
          rx="2">

        <animate
            attributeName="x"
            values="745;850"
            dur="1.3s"
            begin="0.35s"
            repeatCount="indefinite"/>

        <animate
            attributeName="y"
            values="165;180"
            dur="1.3s"
            begin="0.35s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="1;0"
            dur="1.3s"
            begin="0.35s"
            repeatCount="indefinite"/>

      </rect>


      <rect
          x="745"
          y="175"
          width="5"
          height="5"
          rx="1">

        <animate
            attributeName="x"
            values="745;830"
            dur="1.3s"
            begin="0.7s"
            repeatCount="indefinite"/>

        <animate
            attributeName="y"
            values="175;200"
            dur="1.3s"
            begin="0.7s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="1;0"
            dur="1.3s"
            begin="0.7s"
            repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- ================================================= -->
    <!-- TERMINAL LOG -->
    <!-- ================================================= -->

    <g
        fill="#00FF88"
        font-size="12"
        opacity="0.7">

      <text x="35" y="75">
        &gt; INITIALIZING NETX CORE_
      </text>

      <text x="35" y="95">
        &gt; NETWORK ENGINE ........ ONLINE
      </text>

      <text x="35" y="115">
        &gt; PACKET MONITOR ........ ACTIVE
      </text>

      <text x="35" y="135">
        &gt; DIAGNOSTIC ENGINE ..... READY
      </text>

    </g>


    <!-- ================================================= -->
    <!-- STATUS -->
    <!-- ================================================= -->

    <text
        x="450"
        y="385"
        text-anchor="middle"
        fill="#00FF88"
        font-size="14"
        font-weight="bold"
        filter="url(#glow)">

      &gt; NETX NETWORK GUARDIAN — SYSTEM ONLINE_

      <animate
          attributeName="opacity"
          values="1;0.45;1"
          dur="1.8s"
          repeatCount="indefinite"/>

    </text>


    <!-- ================================================= -->
    <!-- BORDER -->
    <!-- ================================================= -->

    <rect
        x="1"
        y="1"
        width="898"
        height="418"
        rx="16"
        fill="none"
        stroke="#00FF88"
        stroke-width="1"
        stroke-opacity="0.5"/>

  </g>

</svg>

</div>
